# nginx.conf — Configuracao de proxy reverso para a plataforma MultiBots
#
# Roteamento:
#   /           → Frontend (arquivos estaticos do Vite)
#   /api        → Backend Node.js (porta 9999)
#   /ws         → WebSocket para o backend
#
# Seguranca:
#   - Headers de seguranca padrao
#   - Rate limiting por IP
#   - Compressao gzip habilitada
#   - Cache de assets estaticos

# --- Upstream do backend ---
upstream backend_api {
    server backend:9999;
    keepalive 32;
}

# --- Rate limiting ---
# Limite de 30 requisicoes por segundo por IP (burst de 50)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# Limite mais restrito para endpoints sensiveis
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # --- Tamanho maximo de upload ---
    client_max_body_size 50M;

    # --- Compressao gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # --- Headers de seguranca ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Proxy reverso: /api → Backend ---
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # --- Rate limit mais restrito para autenticacao ---
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://backend_api/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --- WebSocket: /ws → Backend ---
    location /ws {
        proxy_pass http://backend_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout maior para WebSocket (10 minutos)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Cache de assets estaticos ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Frontend: SPA (fallback para index.html) ---
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache curto para o index.html (permite atualizacoes rapidas)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }
    }

    # --- Health check do Nginx ---
    location /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # --- Bloqueia acesso a arquivos sensiveis ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Logs ---
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
