# docker-compose.yml — Orquestracao de servicos da plataforma MultiBots
#
# IMPORTANTE: Este projeto usa o MongoDB e Redis do ghost-marketplace (producao).
# NAO cria instancias proprias de banco/cache.
#
# Servicos:
#   - backend:  API Node.js (porta 9999)
#   - frontend: Interface web Vite + Nginx (porta 3004 no host)
#
# Uso:
#   docker compose up -d              # Sobe todos os servicos
#   docker compose logs -f backend    # Acompanha logs do backend
#   docker compose down               # Para tudo

services:
  # --- Backend (API Node.js) ---
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: multibots-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:9999"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 9999
    depends_on: []
    networks:
      - multibots-net
      - ghost-app-network
      - ghost-db-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - multibots-uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # --- Frontend (Vite + Nginx) ---
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api
        VITE_APP_NAME: MultiBots
        VITE_WS_URL: https://multibot.ghoststore.cc
    container_name: multibots-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - multibots-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

# --- Volumes ---
volumes:
  multibots-uploads:
    name: multibots-uploads

# --- Redes ---
networks:
  multibots-net:
    driver: bridge
    name: multibots-network
  ghost-app-network:
    external: true
  ghost-db-network:
    external: true
