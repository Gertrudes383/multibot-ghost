# docker-compose.yml — Orquestracao de servicos da plataforma MultiBots
#
# Servicos:
#   - mongodb:  Banco de dados principal (Mongo 7 com autenticacao)
#   - redis:    Cache e controle de sessoes/rate-limiting
#   - backend:  API Node.js (porta 9999)
#   - frontend: Interface web Vite + Nginx (porta 80)
#
# Uso:
#   docker compose up -d              # Sobe todos os servicos
#   docker compose logs -f backend    # Acompanha logs do backend
#   docker compose down               # Para tudo
#   docker compose down -v            # Para tudo e remove volumes

version: '3.8'

services:
  # --- MongoDB ---
  mongodb:
    image: mongo:7
    container_name: multibots-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-multibots_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-S3nh4F0rt3!M0ng0}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-multibots}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - multibots-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Limites de recursos
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: multibots-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASS:-R3d1sP4ss!}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - multibots-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-R3d1sP4ss!}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # --- Backend (API Node.js) ---
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: multibots-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-9999}:9999"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 9999
      MONGODB_URI: mongodb://${MONGO_USER:-multibots_admin}:${MONGO_PASS:-S3nh4F0rt3!M0ng0}@mongodb:27017/${MONGO_DB:-multibots}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASS:-R3d1sP4ss!}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-TroqueEsteSegredoEmProducao!2024}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ChaveDeEncriptacao32Caracteres!}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,https://multibot.ghoststore.cc}
      SUPPLIER_API_URL: ${SUPPLIER_API_URL:-http://ghost-multibot-api:3003}
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY:-}
      SUPPLIER_WEBHOOK_SECRET: ${SUPPLIER_WEBHOOK_SECRET:-}
      PIX_WEBHOOK_SECRET: ${PIX_WEBHOOK_SECRET:-test-secret}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_CALLBACK_URL: ${NOWPAYMENTS_CALLBACK_URL:-http://localhost/api/webhooks/crypto/callback}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - multibots-net
      - ghost-app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # --- Frontend (Vite + Nginx) ---
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: multibots-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - multibots-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

# --- Volumes persistentes ---
volumes:
  mongodb_data:
    driver: local
    name: multibots-mongodb-data
  mongodb_config:
    driver: local
    name: multibots-mongodb-config
  redis_data:
    driver: local
    name: multibots-redis-data

# --- Redes ---
networks:
  multibots-net:
    driver: bridge
    name: multibots-network
  ghost-app-network:
    external: true
